# @package _global_
# Stage-1 native A3 tokenizer training.  Physics rollouts only supply batches;
# PPO and action-BC gradients are disabled, and the dynamics decoder is frozen.

defaults:
  - /exp/manager/universal_token/all_modes/sonic_a3_walk

project_name: TRL_A3_Kinematic_Stage1
experiment_name: ${exp_base}_${exp_var}
num_envs: 4096
checkpoint: null
use_wandb: false

manager_env:
  commands:
    motion:
      motion_lib_cfg:
        motion_file: sample_data/a3_stage1_training/a3_stage1_kinematic_train.pkl

algo:
  trl:
    report_to: tensorboard
    logging_steps: 1
  config:
    # Reconstruction-only optimization for this stage.
    ppo_loss_coef: 0.0
    num_learning_iterations: 1000
    freeze_noise_std: true
    actor:
      backbone:
        decoders:
          a3_dyn:
            freeze: true
        aux_loss_coef:
          a3_recon: 1.0
          a3_action_bc: 0.0
